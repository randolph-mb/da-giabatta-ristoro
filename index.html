:root {
  --paper:   oklch(0.97 0.015 75);
  --ink:     oklch(0.22 0.02 50);
  --accent:  oklch(0.35 0.14 25);
  --muted:   oklch(0.62 0.13 40);
  --hairline: oklch(0.88 0.02 60);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Karla, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(28px, 6vw, 64px);
  text-align: center;
}

main {
  max-width: 46ch;
  animation: rise .7s ease-out both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.brand {
  font-family: 'Libre Caslon Text', serif;
  font-size: clamp(16px, 2vw, 20px);
  letter-spacing: 0.02em;
  margin: 0 0 clamp(28px, 6vw, 44px);
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.15em;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin: 0 0 14px;
}

h1 {
  font-family: 'Libre Caslon Text', serif;
  font-weight: 400;
  font-size: clamp(34px, 6vw, 60px);
  line-height: 1.1;
  margin: 0 0 20px;
  text-wrap: balance;
}

p {
  font-size: clamp(16px, 2vw, 18px);
  line-height: 1.65;
  margin: 0 auto 14px;
}

.en {
  font-size: 15px;
  opacity: 0.62;
  margin-top: 20px;
}

hr {
  border: 0;
  border-top: 1px solid var(--hairline);
  width: 64px;
  margin: clamp(30px, 5vw, 44px) auto;
}

footer {
  font-size: 14px;
  opacity: 0.62;
  line-height: 1.7;
}

.rule {
  display: block;
  width: 40px;
  height: 2px;
  background: var(--accent);
  margin: 0 auto 26px;
}

@media (prefers-reduced-motion: reduce) {
  main { animation: none; }
